<h1>Collectify</h1>

@if (error()) {
  <p>{{ error() }}</p>
}

@if (products().length === 0 && !error()) {
  <p>Cargando productos...</p>
}

@for (product of products(); track product.id) {
  <article>
    <h2>{{ product.name }}</h2>

    <p>{{ product.description }}</p>

    <p>Precio: ${{ product.price }}</p>

    <p>Stock: {{ product.stock }}</p>

    <p>SKU: {{ product.sku }}</p>
  </article>
}
