<!-- CABECERA MÓVIL -->
<div class="mobile-header">
  <a
    routerLink="/dashboard"
    class="mobile-brand"
    (click)="closeMobileMenu()"
  >
    <span class="brand__mark">C</span>
    <span>Collectify</span>
  </a>

  <button
    #mobileToggle
    type="button"
    class="icon-button"
    aria-controls="collectify-sidebar"
    [attr.aria-expanded]="mobileMenuOpen"
    [attr.aria-label]="mobileMenuOpen ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMobileMenu()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 8h14M5 16h14" />
    </svg>
  </button>
</div>

<!-- FONDO MÓVIL -->
<button
  type="button"
  class="backdrop"
  [class.backdrop--open]="mobileMenuOpen"
  [attr.tabindex]="mobileMenuOpen ? 0 : -1"
  aria-label="Cerrar menú"
  (click)="closeMobileMenu()"
></button>

<!-- BARRA LATERAL -->
<header
  id="collectify-sidebar"
  class="sidebar"
  [class.sidebar--collapsed]="collapsed"
  [class.sidebar--open]="mobileMenuOpen"
>
  <!-- =====================================================
       PARTE SUPERIOR
       ===================================================== -->

  <div class="sidebar__top">

    <a
      routerLink="/dashboard"
      class="brand"
      aria-label="Collectify, ir al dashboard"
      (click)="closeMobileMenu()"
    >
      <span class="brand__mark">C</span>

      <span class="brand__copy">
        <span class="brand__name">
          Collectify
        </span>

        <span class="brand__description">
          Inventario inteligente
        </span>
      </span>
    </a>

    <button
      type="button"
      class="icon-button mobile-close"
      aria-label="Cerrar menú"
      (click)="closeMobileMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>

  </div>


  <!-- =====================================================
       NAVEGACIÓN
       ===================================================== -->

  <nav
    class="navigation"
    aria-label="Navegación principal"
  >

    <!-- NAVEGACIÓN PRINCIPAL -->

    <div class="navigation__group">

      @for (
        item of mainNavigation;
        track item.route
      ) {

        <a
          class="navigation__link"
          [routerLink]="item.route"
          routerLinkActive="navigation__link--active"
          [routerLinkActiveOptions]="{
            exact: item.exact
          }"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="item.label"
          [attr.title]="collapsed ? item.label : null"
          (click)="closeMobileMenu()"
        >

          <svg
            class="navigation__icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            @for (
              path of item.paths;
              track $index
            ) {

              <path
                [attr.d]="path"
              />

            }

          </svg>

          <span class="navigation__label">
            {{ item.label }}
          </span>

        </a>

      }

    </div>


    <!-- =================================================
         ASISTENTE IA
         ================================================= -->

    <div class="navigation__section">

      <span class="navigation__caption">
        ASISTENTE
      </span>


      <a
        routerLink="/ai"
        routerLinkActive="navigation__link--active"
        ariaCurrentWhenActive="page"
        class="navigation__link navigation__link--ai"
        aria-label="Asistente IA"
        [attr.title]="collapsed ? 'Asistente IA' : null"
        (click)="closeMobileMenu()"
      >

        <!-- ICONO IA -->

        <svg
          class="navigation__icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"
          />

        </svg>


        <!-- TEXTO -->

        <span class="navigation__ai-copy">

          <span class="navigation__label">
            Asistente IA
          </span>

          <span class="navigation__badge">
            Inteligente
          </span>

        </span>

      </a>

    </div>

  </nav>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="sidebar__footer">

    <!-- PERFIL -->

    <div
      class="profile"
      aria-label="Perfil de Ezequiel"
      [attr.title]="collapsed ? 'Ezequiel' : null"
    >

      <span class="profile__avatar">
        E
      </span>

      <span class="profile__copy">

        <span class="profile__name">
          Ezequiel
        </span>

        <span class="profile__description">
          Collectify
        </span>

      </span>

    </div>


    <!-- BOTÓN COLAPSAR -->

    <button
      type="button"
      class="collapse-button"
      aria-controls="collectify-sidebar"
      [attr.aria-expanded]="!collapsed"
      [attr.aria-label]="
        collapsed
          ? 'Expandir menú'
          : 'Contraer menú'
      "
      [attr.title]="
        collapsed
          ? 'Expandir menú'
          : 'Contraer menú'
      "
      (click)="toggleSidebar()"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <rect
          x="3"
          y="4"
          width="18"
          height="16"
          rx="3"
        />

        <path d="M9 4v16" />

        <path
          [attr.d]="
            collapsed
              ? 'm13 9 3 3-3 3'
              : 'm16 9-3 3 3 3'
          "
        />

      </svg>

      <span class="collapse-button__label">
        Contraer menú
      </span>

    </button>

  </footer>

</header>
