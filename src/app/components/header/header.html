<!-- BARRA SUPERIOR MÓVIL -->

<div class="mobile-bar">

  <a
    routerLink="/dashboard"
    class="mobile-brand"
    aria-label="Collectify, ir al dashboard"
    (click)="closeMobileMenu(false)"
  >
    <img
      [src]="logoPath"
      alt=""
      width="40"
      height="40"
      class="mobile-brand__logo"
    />

    <span>Collectify</span>
  </a>


  <button
    #mobileToggle
    type="button"
    class="icon-button mobile-menu-button"
    aria-controls="collectify-sidebar"
    [attr.aria-expanded]="mobileMenuOpen()"
    [attr.aria-label]="mobileMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMobileMenu()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

</div>


<!-- FONDO DEL MENÚ MÓVIL -->

@if (mobileMenuOpen()) {
  <div
    class="sidebar-backdrop"
    aria-hidden="true"
    (click)="closeMobileMenu()"
  ></div>
}


<!-- BARRA LATERAL -->

<aside
  #sidebar
  id="collectify-sidebar"
  class="sidebar"
  [class.sidebar--open]="mobileMenuOpen()"
  [attr.inert]="isMobile() && !mobileMenuOpen() ? '' : null"
  [attr.role]="isMobile() && mobileMenuOpen() ? 'dialog' : null"
  [attr.aria-modal]="isMobile() && mobileMenuOpen() ? 'true' : null"
  aria-label="Menú principal de Collectify"
>

  <!-- LOGO -->

  <div class="sidebar__header">

    <a
      routerLink="/dashboard"
      class="brand"
      aria-label="Collectify, ir al dashboard"
      (click)="closeMobileMenu(false)"
    >

      <span class="brand__logo-wrap">
        <img
          [src]="logoPath"
          alt=""
          width="46"
          height="46"
          class="brand__logo"
        />
      </span>

      <span class="brand__text">
        <span class="brand__name">Collectify</span>
        <span class="brand__description">
          Inventario inteligente
        </span>
      </span>

    </a>


    <button
      #mobileClose
      type="button"
      class="icon-button mobile-close"
      aria-label="Cerrar menú"
      (click)="closeMobileMenu()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>

  </div>


  <!-- NAVEGACIÓN -->

  <div class="sidebar__body">

    <span class="sidebar__label">ESPACIO DE TRABAJO</span>

    <nav
      id="collectify-navigation"
      class="navigation"
      aria-label="Navegación principal"
    >

      @for (item of navigation; track item.route) {

        <a
          [routerLink]="item.route"
          routerLinkActive="navigation__link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          ariaCurrentWhenActive="page"
          class="navigation__link"
          [attr.aria-label]="item.label"
          [attr.title]="collapsed() && !isMobile() ? item.label : null"
          (click)="closeMobileMenu(false)"
        >

          <span class="navigation__icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              @for (path of item.paths; track $index) {
                <path [attr.d]="path" />
              }
            </svg>
          </span>

          <span class="navigation__label">
            {{ item.label }}
          </span>

          <span class="navigation__indicator" aria-hidden="true"></span>

        </a>

      }

    </nav>

  </div>


  <!-- PIE -->

  <div class="sidebar__footer">

    <div class="profile" aria-label="Ezequiel">

      <span class="profile__avatar" aria-hidden="true">E</span>

      <span class="profile__info">
        <strong>Ezequiel</strong>
        <span>Collectify</span>
      </span>

    </div>


    <button
      type="button"
      class="collapse-button"
      aria-controls="collectify-navigation"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="collapsed() ? 'Expandir barra lateral' : 'Contraer barra lateral'"
      [attr.title]="collapsed() ? 'Expandir menú' : 'Contraer menú'"
      (click)="toggleCollapsed()"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        [class.collapse-button__icon--reversed]="collapsed()"
        aria-hidden="true"
      >
        <path d="m14 7-5 5 5 5M20 4v16" />
      </svg>

      <span>Contraer menú</span>

    </button>

  </div>

</aside>
