<section class="product-form">

  <div class="product-form__header">
    <span>INVENTARIO</span>
    <h2>Nuevo producto</h2>
    <p>Agrega un producto a tu inventario.</p>
  </div>

  @if (success()) {
    <div class="product-form__success">
      {{ success() }}
    </div>
  }

  @if (error()) {
    <div class="product-form__error">
      {{ error() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="form-group">
      <label for="name">Nombre</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Ej. Funko Batman"
      />

      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small>El nombre es obligatorio.</small>
      }
    </div>

    <div class="form-group">
      <label for="description">Descripción</label>
      <textarea
        id="description"
        formControlName="description"
        placeholder="Descripción del producto"
      ></textarea>
    </div>

    <div class="form-row">

      <div class="form-group">
        <label for="category">Categoría</label>
        <input
          id="category"
          type="text"
          formControlName="category"
          placeholder="Ej. Funko"
        />
      </div>

      <div class="form-group">
        <label for="sku">SKU</label>
        <input
          id="sku"
          type="text"
          formControlName="sku"
          placeholder="Ej. FK-BAT-001"
        />
      </div>

    </div>

    <div class="form-row">

      <div class="form-group">
        <label for="price">Precio</label>
        <input
          id="price"
          type="number"
          formControlName="price"
          min="0.01"
          step="0.01"
        />
      </div>

      <div class="form-group">
        <label for="cost">Costo</label>
        <input
          id="cost"
          type="number"
          formControlName="cost"
          min="0"
          step="0.01"
        />
      </div>

    </div>

    <div class="form-group">
      <label for="stock">Stock</label>
      <input
        id="stock"
        type="number"
        formControlName="stock"
        min="0"
      />
    </div>

    <div class="form-group">
      <label for="image_url">URL de imagen</label>
      <input
        id="image_url"
        type="url"
        formControlName="image_url"
        placeholder="https://..."
      />
    </div>

    <button
      type="submit"
      [disabled]="loading()"
    >
      @if (loading()) {
        Creando...
      } @else {
        Crear producto
      }
    </button>

  </form>

</section>
