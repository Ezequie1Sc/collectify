<section
  id="product-form"
  class="product-form"
>

  <div class="product-form__header">

    <span class="eyebrow">
      {{ isEditing ? 'EDICIÓN' : 'INVENTARIO' }}
    </span>

    <h2>
      {{ isEditing ? 'Editar producto' : 'Nuevo producto' }}
    </h2>

    <p>
      {{
        isEditing
          ? 'Actualiza la información de tu producto.'
          : 'Agrega un producto a tu inventario.'
      }}
    </p>

  </div>

  @if (success()) {
    <div class="message message--success">
      {{ success() }}
    </div>
  }

  @if (error()) {
    <div class="message message--error">
      {{ error() }}
    </div>
  }

  <form
    class="form"
    (submit)="$event.preventDefault(); saveProduct()"
  >

    <!-- Nombre -->

    <div class="form__field">

      <label for="name">
        Nombre
      </label>

      <input
        id="name"
        type="text"
        name="name"
        placeholder="Ej. Funko Batman"
        [(ngModel)]="product.name"
        required
      />

    </div>


    <!-- Descripción -->

    <div class="form__field">

      <label for="description">
        Descripción
      </label>

      <textarea
        id="description"
        name="description"
        placeholder="Descripción del producto"
        [(ngModel)]="product.description"
        rows="3"
      ></textarea>

    </div>


    <!-- Categoría / SKU -->

    <div class="form__row">

      <div class="form__field">

        <label for="category">
          Categoría
        </label>

        <input
          id="category"
          type="text"
          name="category"
          placeholder="Ej. Funko"
          [(ngModel)]="product.category"
        />

      </div>


      <div class="form__field">

        <label for="sku">
          SKU
        </label>

        <input
          id="sku"
          type="text"
          name="sku"
          placeholder="Ej. FK-BAT-001"
          [(ngModel)]="product.sku"
        />

      </div>

    </div>


    <!-- Precio / Costo -->

    <div class="form__row">

      <div class="form__field">

        <label for="price">
          Precio
        </label>

        <input
          id="price"
          type="number"
          name="price"
          min="0.01"
          step="0.01"
          placeholder="0.00"
          [(ngModel)]="product.price"
          required
        />

      </div>


      <div class="form__field">

        <label for="cost">
          Costo
        </label>

        <input
          id="cost"
          type="number"
          name="cost"
          min="0"
          step="0.01"
          placeholder="0.00"
          [(ngModel)]="product.cost"
        />

      </div>

    </div>


    <!-- Stock -->

    <div class="form__field">

      <label for="stock">
        Stock
      </label>

      <input
        id="stock"
        type="number"
        name="stock"
        min="0"
        step="1"
        placeholder="0"
        [(ngModel)]="product.stock"
      />

    </div>


    <!-- Imagen -->

    <div class="form__field">

      <label for="image_url">
        URL de imagen
      </label>

      <input
        id="image_url"
        type="url"
        name="image_url"
        placeholder="https://..."
        [(ngModel)]="product.image_url"
      />

    </div>


    <!-- Acciones -->

    <div class="form__actions">

      <button
        type="submit"
        class="form__submit"
        [disabled]="loading()"
      >

        @if (loading()) {

          {{
            isEditing
              ? 'Guardando cambios...'
              : 'Creando producto...'
          }}

        } @else {

          {{
            isEditing
              ? 'Guardar cambios'
              : 'Crear producto'
          }}

        }

      </button>


      @if (isEditing) {

        <button
          type="button"
          class="form__cancel"
          [disabled]="loading()"
          (click)="cancelEdit()"
        >
          Cancelar edición
        </button>

      }

    </div>

  </form>

</section>
